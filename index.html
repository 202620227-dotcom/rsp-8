<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 가위바위보 손 모양 인식기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font (Inter & Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    .mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-indigo-50 min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6">

  <!-- 메인 컨테이너 -->
  <main class="max-w-4xl mx-auto w-full flex-grow flex flex-col items-center justify-center">
    
    <!-- 타이틀 영역 -->
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-white/80 backdrop-blur-md rounded-full shadow-sm text-indigo-600 text-sm font-bold mb-3 border border-indigo-100">
        <span>✨ Roboflow ViT AI Powered</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">
        AI 가위바위보 손 모양 인식기 ✊🖐✌
      </h1>
      <p class="text-slate-500 text-sm sm:text-base mt-2">
        실시간 카메라나 사진 업로드로 손 모양을 분석해보세요!
      </p>
    </header>

    <!-- 중앙 메인 카드 -->
    <div class="w-full bg-white/80 backdrop-blur-xl border border-white/60 rounded-3xl shadow-xl p-4 sm:p-6 transition-all">
      
      <!-- 웹캠 & 결과 오버레이 화면 -->
      <div class="relative w-full aspect-[4/3] sm:aspect-[16/9] bg-slate-900 rounded-2xl overflow-hidden border-4 border-indigo-100 shadow-inner flex items-center justify-center">
        
        <!-- 실시간 비디오 -->
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover mirror hidden"></video>

        <!-- 카메라 꺼짐 상태 안내 화면 -->
        <div id="videoPlaceholder" class="flex flex-col items-center justify-center text-slate-400 p-6 text-center">
          <div class="w-16 h-16 rounded-2xl bg-slate-800/60 flex items-center justify-center mb-3 text-3xl">
            📷
          </div>
          <p class="font-medium text-slate-300">카메라가 꺼져 있습니다.</p>
          <p class="text-xs text-slate-500 mt-1">[카메라 시작] 버튼을 누르거나 사진을 업로드해 주세요.</p>
        </div>

        <!-- 숨겨진 캡처용 Canvas -->
        <canvas id="captureCanvas" class="hidden"></canvas>

        <!-- [오른쪽 상단] 실시간 인식 결과 배지 -->
        <div id="resultBadge" class="absolute top-4 right-4 bg-white/95 backdrop-blur-md border border-indigo-100 shadow-xl rounded-2xl px-4 py-3 flex items-center gap-3 transition-all duration-300 z-10 min-w-[160px]">
          <span id="gestureEmoji" class="text-3xl sm:text-4xl select-none">❓</span>
          <div class="text-left">
            <div id="gestureLabel" class="font-extrabold text-slate-800 text-base sm:text-lg">대기 중</div>
            <div class="flex items-center gap-1.5 mt-0.5">
              <div class="w-16 bg-slate-100 h-2 rounded-full overflow-hidden border border-slate-200">
                <div id="confidenceBar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
              </div>
              <span id="gestureConfidence" class="text-xs font-bold text-indigo-600">0%</span>
            </div>
          </div>
        </div>

        <!-- 처리 중 로딩 인디케이터 -->
        <div id="loadingOverlay" class="hidden absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2 shadow-md">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-ping"></div>
          <span>AI 분석 진행 중...</span>
        </div>
      </div>

      <!-- 상태 및 에러 메시지 출력 상자 -->
      <div id="statusBox" class="hidden mt-4 p-3.5 rounded-2xl text-sm font-semibold text-center border transition-all"></div>

      <!-- 컨트롤 버튼 영역 -->
      <div class="mt-6 flex flex-wrap justify-center gap-2.5 sm:gap-3">
        
        <!-- 카메라 시작 버튼 -->
        <button id="btnStartCamera" onclick="startCamera()" class="flex-1 min-w-[130px] bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-sm sm:text-base">
          <span>🎥</span> 카메라 시작
        </button>

        <!-- 인식 시작 버튼 -->
        <button id="btnStartPredict" onclick="startRecognition()" disabled class="flex-1 min-w-[130px] bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed active:scale-95 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-sm sm:text-base">
          <span>▶️</span> 인식 시작
        </button>

        <!-- 인식 중지 버튼 -->
        <button id="btnStopPredict" onclick="stopRecognition()" disabled class="flex-1 min-w-[130px] bg-amber-500 hover:bg-amber-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed active:scale-95 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-sm sm:text-base">
          <span>⏹️</span> 인식 중지
        </button>

        <!-- 카메라 종료 버튼 -->
        <button id="btnStopCamera" onclick="stopCamera()" disabled class="flex-1 min-w-[130px] bg-rose-500 hover:bg-rose-600 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed active:scale-95 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition-all flex items-center justify-center gap-2 text-sm sm:text-base">
          <span>🛑</span> 카메라 종료
        </button>
      </div>

      <!-- 사진 업로드 기능 -->
      <div class="mt-4 pt-4 border-t border-slate-200/60 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs sm:text-sm text-slate-500">
        <span>💡 카메라이용이 어렵나요? 저장된 사진을 올려보세요.</span>
        <label class="cursor-pointer bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 font-bold px-4 py-2 rounded-xl text-slate-700 shadow-sm transition-all flex items-center gap-2">
          <span>📁</span> 사진 파일 선택
          <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)" class="hidden">
        </label>
      </div>

    </div>
  </main>

  <footer class="mt-6 text-center text-xs text-slate-400">
    Roboflow ViT Model Proxy via Vercel Serverless Function
  </footer>

  <script>
    let videoStream = null;
    let predictInterval = null;
    let isRequesting = false;

    const video = document.getElementById('webcam');
    const placeholder = document.getElementById('videoPlaceholder');
    const canvas = document.getElementById('captureCanvas');
    const statusBox = document.getElementById('statusBox');
    const loadingOverlay = document.getElementById('loadingOverlay');

    const btnStartCamera = document.getElementById('btnStartCamera');
    const btnStopCamera = document.getElementById('btnStopCamera');
    const btnStartPredict = document.getElementById('btnStartPredict');
    const btnStopPredict = document.getElementById('btnStopPredict');

    const gestureEmoji = document.getElementById('gestureEmoji');
    const gestureLabel = document.getElementById('gestureLabel');
    const gestureConfidence = document.getElementById('gestureConfidence');
    const confidenceBar = document.getElementById('confidenceBar');

    function showStatus(message, type = 'info') {
      statusBox.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'border-blue-200', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
      
      if (type === 'error') {
        statusBox.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      } else if (type === 'success') {
        statusBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
      } else {
        statusBox.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
      }
      
      statusBox.innerText = message;
    }

    function clearStatus() {
      statusBox.classList.add('hidden');
      statusBox.innerText = '';
    }

    async function startCamera() {
      clearStatus();
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
        });

        video.srcObject = videoStream;
        video.classList.remove('hidden');
        placeholder.classList.add('hidden');

        btnStartCamera.disabled = true;
        btnStopCamera.disabled = false;
        btnStartPredict.disabled = false;

        showStatus('카메라가 연결되었습니다. [인식 시작] 버튼을 누르세요.', 'success');
      } catch (err) {
        console.error('카메라 접근 에러:', err);
        showStatus('카메라 시작 실패: ' + err.message, 'error');
      }
    }

    function stopCamera() {
      stopRecognition();
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      video.classList.add('hidden');
      placeholder.classList.remove('hidden');

      btnStartCamera.disabled = false;
      btnStopCamera.disabled = true;
      btnStartPredict.disabled = true;
      btnStopPredict.disabled = true;

      showStatus('카메라 연결이 종료되었습니다.', 'info');
    }

    function startRecognition() {
      if (!videoStream) {
        showStatus('먼저 카메라를 시작해 주세요.', 'error');
        return;
      }

      clearStatus();
      btnStartPredict.disabled = true;
      btnStopPredict.disabled = false;

      showStatus('AI 손 모양 실시간 인식을 시작합니다.', 'success');

      predictInterval = setInterval(() => {
        captureAndSend();
      }, 1000);
    }

    function stopRecognition() {
      if (predictInterval) {
        clearInterval(predictInterval);
        predictInterval = null;
      }

      btnStartPredict.disabled = !videoStream;
      btnStopPredict.disabled = true;
      loadingOverlay.classList.add('hidden');

      showStatus('손 모양 인식이 중지되었습니다.', 'info');
    }

    async function captureAndSend() {
      if (isRequesting) return;
      if (!videoStream || video.paused || video.ended) return;

      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.8);

      await sendToPredictAPI(base64Image);
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      stopRecognition();

      const reader = new FileReader();
      reader.onload = async (e) => {
        showStatus('업로드한 사진을 AI가 분석 중입니다...', 'info');
        await sendToPredictAPI(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    async function sendToPredictAPI(base64Image) {
      isRequesting = true;
      loadingOverlay.classList.remove('hidden');

      try {
        const response = await fetch('/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `서버 오류 (${response.status})`);
        }

        parseAndDisplayResult(data);

      } catch (err) {
        console.error('API 호출 실패:', err);
        showStatus('인식 실패: ' + err.message, 'error');
      } finally {
        isRequesting = false;
        loadingOverlay.classList.add('hidden');
      }
    }

    /**
     * Roboflow Workflow / ViT API 응답 심층 유연 파싱
     */
    function parseAndDisplayResult(data) {
      if (!data) return;
      console.log('Roboflow API 원본 응답:', data);

      let topClass = 'unknown';
      let confidence = 0;

      function findClassAndConfidence(obj) {
        if (!obj || typeof obj !== 'object') return null;

        // 1. Workflow outputs / result 구조
        if (Array.isArray(obj.outputs) && obj.outputs.length > 0) {
          for (const item of obj.outputs) {
            const found = findClassAndConfidence(item);
            if (found) return found;
          }
        }

        // 2. predictions 배열 형태 (Detection 또는 Classification List)
        if (Array.isArray(obj.predictions) && obj.predictions.length > 0) {
          const top = obj.predictions[0];
          return {
            class: top.class || top.label || top.name || 'unknown',
            confidence: top.confidence ?? top.score ?? 0
          };
        }

        // 3. predictions 객체 형태 { rock: 0.98, paper: 0.01, scissors: 0.01 }
        if (obj.predictions && typeof obj.predictions === 'object' && !Array.isArray(obj.predictions)) {
          let maxScore = -1;
          let bestClass = 'unknown';
          for (const [key, val] of Object.entries(obj.predictions)) {
            const score = typeof val === 'number' ? val : (val?.confidence ?? val?.score ?? 0);
            if (score > maxScore) {
              maxScore = score;
              bestClass = key;
            }
          }
          if (maxScore > -1) {
            return { class: bestClass, confidence: maxScore };
          }
        }

        // 4. 최상위 top / class 속성
        if (obj.top || obj.class) {
          return {
            class: obj.top || obj.class,
            confidence: obj.confidence ?? obj.score ?? 0
          };
        }

        // 5. 하위 객체 탐색
        for (const key of Object.keys(obj)) {
          if (typeof obj[key] === 'object' && obj[key] !== null) {
            const found = findClassAndConfidence(obj[key]);
            if (found && found.class !== 'unknown') return found;
          }
        }

        return null;
      }

      const res = findClassAndConfidence(data);
      if (res) {
        topClass = String(res.class);
        confidence = Number(res.confidence);
      }

      if (confidence <= 1.0) {
        confidence = Math.round(confidence * 100);
      } else {
        confidence = Math.round(confidence);
      }

      updateResultUI(topClass.toLowerCase(), confidence);
    }

    function updateResultUI(className, confidence) {
      let emoji = '❓';
      let labelKorean = '알 수 없음';

      if (className.includes('rock') || className.includes('바위')) {
        emoji = '✊';
        labelKorean = '바위';
      } else if (className.includes('paper') || className.includes('보')) {
        emoji = '🖐';
        labelKorean = '보';
      } else if (className.includes('scissors') || className.includes('가위')) {
        emoji = '✌';
        labelKorean = '가위';
      }

      gestureEmoji.innerText = emoji;
      gestureLabel.innerText = labelKorean;
      gestureConfidence.innerText = `${confidence}%`;
      confidenceBar.style.width = `${Math.min(100, Math.max(0, confidence))}%`;
    }
  </script>
</body>
</html>
